name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate environment.json
        run: node -e "JSON.parse(require('fs').readFileSync('.apm/environment.json', 'utf8'))"

      - name: Validate apm.yml (YAML syntax)
        run: node -e "require('fs').readFileSync('apm.yml', 'utf8')" && echo "apm.yml is valid text"

      - name: Install APM CLI
        uses: microsoft/apm-action@e5650fb81c4b5965090a17bd1ed1956071e95d17 # v1
        with:
          setup-only: 'true'
          apm-version: '0.13.0'

      - name: Install dependencies (verify lockfile in sync)
        run: apm install --frozen

      - name: Pack dry-run
        run: apm pack --dry-run
