name: devbox-apm
version: 0.6.0
description: DevBox agentic toolkit — curated MCP servers and skills for Claude Code and cross-runtime agents
author: mstlaure
owner: mstlaure

targets:
  - claude
includes: auto

dependencies:
  apm:
    - obra/superpowers
    - anthropics/claude-code/plugins/code-review
    - anthropics/claude-code/plugins/security-guidance
    - anthropics/claude-code/plugins/frontend-design
    - anthropics/claude-code/plugins/feature-dev
    - anthropics/claude-code/plugins/commit-commands
    - anthropics/claude-code/plugins/pr-review-toolkit
    - git: https://github.com/likec4/likec4.git
      path: skills/likec4-dsl
      ref: v1.59.2
    - temporalio/skill-temporal-developer#v0.5.0

  mcp:
    - io.github.github/github-mcp-server
    - name: likec4
      registry: false
      transport: stdio
      command: likec4
      args: ["mcp"]
