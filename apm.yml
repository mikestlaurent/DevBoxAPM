name: devbox-apm
version: 0.1.0
description: DevBox agentic toolkit — curated plugins, skills, and MCP servers for Claude Code and cross-runtime agents
author: mstlaure

# Automatically deploy primitives from .apm/ when present
includes: auto

targets:
  - claude

dependencies:
  # Claude Code plugins and cross-runtime agent skills
  apm:
    - obra/superpowers
    - anthropics/claude-code/plugins/code-review
    - anthropics/claude-code/plugins/security-guidance
    - anthropics/claude-code/plugins/frontend-design
    - anthropics/claude-code/plugins/feature-dev
    - anthropics/claude-code/plugins/commit-commands
    - anthropics/claude-code/plugins/pr-review-toolkit

  # MCP servers wired into all detected clients (Claude, Cursor, Codex, etc.)
  mcp:
    - io.github.github/github-mcp-server
    - io.github.taylorwilsdon/google_workspace_mcp
